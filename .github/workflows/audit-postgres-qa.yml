name: Audit database SQL QA
on:
  push:
    branches: [feature/reference-library-v1]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/audit-postgres-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: mgs_audit_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mgs_audit_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: mgs_audit_qa
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Apply migrations and run SQL regression
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/audit-postgres-bootstrap.sql
          for file in supabase/migrations/*.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$file"
          done
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/project-audit-events.sql
