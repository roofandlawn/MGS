name: Audit Supabase HTTP QA
on:
  push:
    branches: [feature/reference-library-v1]
    paths:
      - 'supabase/migrations/**'
      - 'audit-outbox.js'
      - 'scripts/verify-audit-supabase-http.cjs'
      - '.github/workflows/audit-supabase-http-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-supabase-http:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v3.0.0
        with:
          version: '2.108.0'
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Start disposable Supabase stack (no remote connection)
        run: |
          set -euo pipefail
          qa="$RUNNER_TEMP/mgs-audit-http"
          mkdir -p "$qa"
          cd "$qa"
          supabase init
          mkdir -p supabase/migrations
          cp "$GITHUB_WORKSPACE"/supabase/migrations/*.sql supabase/migrations/
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor
      - name: Test Auth, PostgREST and outbox against local stack
        run: |
          set -euo pipefail
          node --check scripts/verify-audit-supabase-http.cjs
          MGS_DISPOSABLE_QA=1 MGS_QA_WORKDIR="$RUNNER_TEMP/mgs-audit-http" node scripts/verify-audit-supabase-http.cjs
      - name: Dispose of local test database
        if: always()
        run: |
          qa="$RUNNER_TEMP/mgs-audit-http"
          if [ -f "$qa/supabase/config.toml" ]; then
            cd "$qa"
            supabase stop --no-backup
          fi
